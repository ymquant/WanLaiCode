<!doctype html>
<html lang="en" data-window="main" style="background-color: transparent">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>%BRAND_NAME_CN%</title>
    <link rel="icon" type="image/png" href="./favicon-96x96-v3.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./favicon-v3.svg" />
    <link rel="shortcut icon" href="./favicon-v3.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-v3.png" />
    <meta name="theme-color" content="#F8F7F7" />
    <meta name="theme-color" content="#131010" media="(prefers-color-scheme: dark)" />
    <meta property="og:image" content="./social-share.png" />
    <meta property="twitter:image" content="./social-share.png" />
    <script id="oc-theme-preload-script" src="./oc-theme-preload.js"></script>
  </head>
  <body class="antialiased overscroll-none text-12-regular overflow-hidden">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="desktop-startup-cover" data-component="desktop-loading-root" aria-hidden="true">
      <div data-component="desktop-loading-glass">
        <div data-slot="desktop-loading-logo">
          <svg
            data-slot="desktop-loading-logo-svg"
            viewBox="0 0 520 420"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            shape-rendering="geometricPrecision"
            aria-hidden="true"
          >
            <defs>
              <g id="desktop-startup-cover-logo-glyph">
                <polygon points="64,210 104,170 184,250 264,170 344,250 424,170 464,210 424,250 344,330 264,250 184,330 104,250" />
                <polygon points="264,40 304,80 264,120 224,80" />
                <polygon points="184,120 224,160 184,200 144,160" />
                <polygon points="344,120 384,160 344,200 304,160" />
                <polygon points="264,330 304,370 264,410 224,370" />
              </g>
            </defs>
            <use data-slot="desktop-loading-logo-sketch" href="#desktop-startup-cover-logo-glyph" />
          </svg>
          <span data-slot="desktop-loading-logo-sweep" aria-hidden="true"></span>
        </div>
      </div>
    </div>
    <div id="root" class="flex flex-col h-dvh"></div>
    <script src="./index.tsx" type="module"></script>
  </body>
</html>
